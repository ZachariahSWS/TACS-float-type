config_version = 1

[data]
cadence_hours = 6

[paths]
dataset_root = "data/lucie"
tokenizer_run = "runs/tokenizer_smoke"
tokenizer_checkpoint = "runs/tokenizer_smoke/best.pt"
token_root = "data/tokens_smoke"
dynamics_run = "runs/dynamics_smoke"
dynamics_checkpoint = "runs/dynamics_smoke/best.pt"

[runtime]
device = "auto"
precision = "auto"
seed = 0
resume = true
performance_mode = true
compile = false
num_workers = 0
validation_batches = 2
max_train_frames = 64
max_val_frames = 16
max_train_pairs = 64
max_val_pairs = 16

[tokenizer]
width = 64
depth = 1
heads = 4
code_dim = 32
codebook_size = 128
activation_checkpointing = false
decoder_activation_checkpointing = false
decode_scale_batch_size = 1
scale_loss_weights = [0.05, 0.10, 0.15, 0.25, 0.45]
commitment_weight = 0.25

[optimization]
batch_size = 2
gradient_accumulation = 1
epochs = 2
lr = 1e-3
weight_decay = 0.0
gradient_clip = 1.0

[tokenization]
batch_size = 8

[dynamics]
width = 64
depth = 2
heads = 4
activation_checkpointing = false

[dynamics_optimization]
batch_size = 2
gradient_accumulation = 1
epochs = 2
lr = 1e-3
weight_decay = 0.0
gradient_clip = 1.0

[evaluation]
batch_size = 2
maximum_batches = 2
