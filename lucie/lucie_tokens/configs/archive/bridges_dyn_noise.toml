config_version = 1

[data]
cadence_hours = 6

[paths]
dataset_root = "${LUCIE_SOURCE}"
# Tokenizer + tokens are hardcoded to the single seed0 tokenizer; only the
# dynamics output dir and the training seed vary across the sweep, so every
# seed trains a fresh dynamics model off the same tokens.
tokenizer_run = "${LUCIE_WORK}/runs/tokenizer_h100_seed0"
tokenizer_checkpoint = "${LUCIE_WORK}/runs/tokenizer_h100_seed0/best.pt"
token_root = "${LUCIE_WORK}/tokens/h100_seed0"
dynamics_run = "${LUCIE_WORK}/runs/dynamics_noise_${LUCIE_RUN}"
dynamics_checkpoint = "${LUCIE_WORK}/runs/dynamics_noise_${LUCIE_RUN}/best.pt"

[runtime]
device = "cuda"
precision = "auto"
seed = "${LUCIE_SEED}"
resume = true
performance_mode = true
compile = false
compile_mode = "default"
num_workers = 4
prefetch_factor = 2
shuffle_block = 256
validation_batches = 16

[tokenizer]
width = 256
depth = 4
heads = 8
code_dim = 256
codebook_size = 4096
activation_checkpointing = false
decoder_activation_checkpointing = true
decode_scale_batch_size = 5
scale_loss_weights = [0.05, 0.10, 0.15, 0.25, 0.45]
commitment_weight = 0.25

[optimization]
batch_size = 2
gradient_accumulation = 4
epochs = 100
lr = 2e-4
weight_decay = 1e-4
gradient_clip = 1.0

[tokenization]
batch_size = 32

[dynamics]
width = 384
depth = 8
heads = 8
activation_checkpointing = false

[dynamics_optimization]
batch_size = 16
gradient_accumulation = 1
epochs = 100
lr = 2e-4
weight_decay = 0.01
gradient_clip = 1.0
# float-style input noising (same Gaussian noise on x0/x1, re-encode).
input_noise_std = 0.1

[evaluation]
batch_size = 8
maximum_batches = 32
