# FIX CANDIDATE: batch 8 kept (2.6x faster than batch 2) with ema_decay
# lowered 0.99 -> 0.96 to compensate for 4x fewer codebook updates/epoch.
# res48x96 compile-off probe: identical to bridges_h100_res48x96_fast.toml
# except compile = false, 10 epochs, and a FRESH run dir (the fast run's
# latest.pt is the diverged state and must not be resumed).
# Tests whether torch.compile is what broke the EMA codebook update:
# with compile on it exploded at epoch 1; the pre-compile run survived
# to ~epoch 6, so surviving past 6 here implicates compile.
# res48x96 THROUGHPUT PROBE: same model as bridges_h100_res48x96.toml with
# the pipeline work applied — 6h pack as source, compile on, decoder
# activation checkpointing off (peak was 6.3 of 80 GB), batch 2->8.
# Effective batch 16 vs the old 8, so this is also a real training start.
config_version = 1

[data]
cadence_hours = 6

[paths]
dataset_root = "${LUCIE_WORK}/source_packed_6h"
tokenizer_run = "${LUCIE_WORK}/runs/tokenizer_ema_${LUCIE_RUN}"
tokenizer_checkpoint = "${LUCIE_WORK}/runs/tokenizer_ema_${LUCIE_RUN}/best.pt"
token_root = "${LUCIE_WORK}/tokens/${LUCIE_RUN}"
dynamics_run = "${LUCIE_WORK}/runs/dynamics_${LUCIE_RUN}"
dynamics_checkpoint = "${LUCIE_WORK}/runs/dynamics_${LUCIE_RUN}/best.pt"

[runtime]
device = "cuda"
precision = "auto"
seed = "${LUCIE_SEED}"
resume = true
performance_mode = true
compile = false
compile_mode = "default"
num_workers = 4
prefetch_factor = 2
shuffle_block = 256
validation_batches = 16

[tokenizer]
width = 256
depth = 4
heads = 8
code_dim = 256
codebook_size = 4096
# batch 8 gives 4x fewer EMA updates/epoch than batch 2, so decay faster
# per update to keep the per-epoch adaptation rate comparable
ema_decay = 0.96
scales = [[1, 2], [2, 4], [3, 6], [6, 12], [12, 24], [24, 48], [48, 96]]
activation_checkpointing = false
decoder_activation_checkpointing = false
decode_scale_batch_size = 7
scale_loss_weights = [0.03, 0.05, 0.08, 0.12, 0.18, 0.24, 0.3]
commitment_weight = 0.25

[optimization]
batch_size = 8
gradient_accumulation = 2
epochs = 10
lr = 2e-4
weight_decay = 1e-4
gradient_clip = 1.0

[tokenization]
batch_size = 32

[dynamics]
width = 384
depth = 8
heads = 8
# 80 GB H100 has ample headroom; the smoke sweep showed batch 16 uses ~2.5 GB
# and runs ~7.5x faster with checkpointing off (~2.5 min/epoch vs ~18.6).
activation_checkpointing = false

[dynamics_optimization]
# batch 16 x accum 1 = effective batch 16, identical optimization to the
# original 4x4 but ~7.5x faster on the underused GPU.
batch_size = 16
gradient_accumulation = 1
epochs = 100
lr = 2e-4
weight_decay = 0.01
gradient_clip = 1.0

[evaluation]
batch_size = 8
maximum_batches = 32
