# LOCAL (5070) diagnostics for dyn_bm_res24 -- tranche B, 1-HOUR lead.
# cadence_hours = 1 so the forcing clock advances one hour per model step;
# pass --record-every 6 to score at the 6-hourly cadence of the references.
config_version = 1

[data]
cadence_hours = 1

[paths]
dataset_root = "${LUCIE_SOURCE}"
tokenizer_run = "${LUCIE_WORK}/runs/tokenizer_res24x48_seed0"
tokenizer_checkpoint = "${LUCIE_WORK}/runs/tokenizer_res24x48_seed0/best.pt"
token_root = "${LUCIE_WORK}/tokens/res24x48_seed0_1h"
dynamics_run = "${LUCIE_WORK}/runs/dyn_bm_res24"
dynamics_checkpoint = "${LUCIE_WORK}/runs/dyn_bm_res24/best.pt"

[runtime]
device = "cuda"
precision = "auto"
seed = "${LUCIE_SEED}"
resume = true
performance_mode = true
compile = false
num_workers = 2
validation_batches = 16

[tokenizer]
width = 256
depth = 4
heads = 8
code_dim = 256
codebook_size = 4096
scales = [[1, 2], [2, 4], [3, 6], [6, 12], [12, 24], [24, 48]]
activation_checkpointing = false
decoder_activation_checkpointing = true
decode_scale_batch_size = 6

[dynamics]
conditioning = true
conditioning_co2 = false
dropout = 0.1
width = 512
depth = 12
heads = 8
activation_checkpointing = false

[dynamics_optimization]
batch_size = 16
gradient_accumulation = 1
epochs = 5
lr = 2e-4
weight_decay = 0.05
gradient_clip = 1.0

[evaluation]
batch_size = 8
maximum_batches = 32
