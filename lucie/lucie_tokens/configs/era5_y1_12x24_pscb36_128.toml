# 2026-09-07 arm: era5_y1_12x24_pscb with the 3x6 slice shrunk 256 -> 128. pscb
# fixed 1x2 (held-out top-1 0.72 ~ persistence) but 3x6 at 256 codes was still
# fully memorised (train 1.0 / held-out 0.20). Sibling pscb36_64 shrinks it to 64.
# ERA5 T30 full-year split, 12x24, PER-SCALE CODEBOOK arm (2026-09-07). Same as
# era5_y1_12x24.toml except [tokenizer] codebook_sizes (+ relative dead-code
# threshold). Tests fix (b) of the coarse-memorisation finding: the shared
# 4096-way book gives the coarse scales ~11 samples/code and the dynamics model
# memorises them; small private coarse books should make transitions learnable.
# Judge by rollout vs era5_refs/y1 (baseline ep24 KE relL2 0.210) and held-out
# coarse top-1 vs persistence (analyze.py mechanism).
#
# The original split (train [0,16000], val [16000,16200]) validated on 200
# frames = 50 days starting mid-December: every val CE number and every truth
# reference for spectra/histograms was ONE WINTER, while rollouts span 500
# days of all seasons. This split holds out a full year (1460 frames) for
# validation and the remainder for test, so seasonally-marginal statistics
# (pixel EMD, coarse-token entropy, chain persistence) are measured against
# a reference with the same seasonal coverage as the rollout.
#
# Dynamics: 50 epochs under the warmup+cosine LR schedule (runtime default),
# milestone checkpoints every 5 epochs for rollout-vs-epoch selection, and the
# whole val split scored every epoch (validation_batches = 0).
config_version = 1

[data]
source_kind = "era5_npz"
npz_path = "${LUCIE_WORK}/datasets/lucie_zenodo_15164648/era5_T30_regridded.npz"
channels = ["temperature", "humidity", "u_wind", "v_wind", "surface_pressure"]
cadence_hours = 6
dtype = "bf16"

[data.split_index]
# regridded.npz has 16538 6-hourly frames (1979-01-01 .. ~1990-04).
# train = first 10 years, val = ONE FULL YEAR (1460 frames), test = the rest.
train = [0, 14600]
val = [14600, 16060]
test = [16060, 16538]

[paths]
dataset_root = "${LUCIE_WORK}/datasets/lucie_zenodo_15164648"
tokenizer_run = "${LUCIE_WORK}/runs/tokenizer_era5t30_${LUCIE_RUN}"
tokenizer_checkpoint = "${LUCIE_WORK}/runs/tokenizer_era5t30_${LUCIE_RUN}/best.pt"
token_root = "${LUCIE_WORK}/tokens/era5t30_${LUCIE_RUN}"
dynamics_run = "${LUCIE_WORK}/runs/dynamics_era5t30_${LUCIE_RUN}"
dynamics_checkpoint = "${LUCIE_WORK}/runs/dynamics_era5t30_${LUCIE_RUN}/best.pt"

[runtime]
device = "cuda"
precision = "auto"
seed = "${LUCIE_SEED}"
resume = true
performance_mode = true
compile = false
validation_batches = 0

[tokenizer]
width = 256
depth = 4
heads = 8
code_dim = 256
codebook_size = 4096
# PER-SCALE CODEBOOKS: private id slices 64|128|256|1024|4096 -> ~1000 train
# samples per code at EVERY scale (1x2: 29200 tokens/64; 12x24: 4.2M/4096)
# instead of ~11 per coarse code under the shared book. Relative dead-code
# threshold is REQUIRED for small slices (32 tokens/step at 1x2).
codebook_sizes = [64, 128, 128, 1024, 4096]
dead_code_relative = true
dead_code_threshold = 0.1
scales = [[1, 2], [2, 4], [3, 6], [6, 12], [12, 24]]
activation_checkpointing = false
decoder_activation_checkpointing = false
decode_scale_batch_size = 5
scale_loss_weights = [0.05, 0.10, 0.15, 0.25, 0.45]
commitment_weight = 0.25
ema_decay = 0.99

[optimization]
# in-VRAM frames, effective batch 16 (batch 16 x accum 1) to match the codebook
# EMA update count the seed0 tokenizer used.
batch_size = 16
gradient_accumulation = 1
epochs = 100
lr = 2e-4
weight_decay = 1e-4
gradient_clip = 1.0

[tokenization]
batch_size = 64

[dynamics]
width = 384
depth = 8
heads = 8
activation_checkpointing = false

[dynamics_optimization]
batch_size = 16
gradient_accumulation = 1
epochs = 50
lr = 2e-4
weight_decay = 0.01
gradient_clip = 1.0
lr_schedule = "cosine"
checkpoint_epochs = [5, 10, 15, 20, 25, 30, 35, 40, 45, 50]

[evaluation]
batch_size = 8
maximum_batches = 32
