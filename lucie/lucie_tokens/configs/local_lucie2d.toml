config_version = 1

[data]
cadence_hours = 6

[paths]
dataset_root = "../data/pipeline_lucie2d"
tokenizer_run = "runs/lucie2d_tokenizer"
tokenizer_checkpoint = "runs/lucie2d_tokenizer/best.pt"
token_root = "../data/tokens_lucie2d"
dynamics_run = "runs/lucie2d_dynamics"
dynamics_checkpoint = "runs/lucie2d_dynamics/best.pt"

[runtime]
device = "auto"
precision = "auto"
seed = 0
resume = true
performance_mode = true
compile = false
num_workers = 2
prefetch_factor = 2
shuffle_block = 256
validation_batches = 16

[tokenizer]
width = 128
depth = 3
heads = 8
code_dim = 128
codebook_size = 2048
activation_checkpointing = false
decoder_activation_checkpointing = true
decode_scale_batch_size = 5
scale_loss_weights = [0.05, 0.10, 0.15, 0.25, 0.45]
commitment_weight = 0.25

[optimization]
batch_size = 8
gradient_accumulation = 2
epochs = 100
lr = 2e-4
weight_decay = 1e-4
gradient_clip = 1.0

[tokenization]
batch_size = 64

[dynamics]
width = 256
depth = 6
heads = 8
activation_checkpointing = false

[dynamics_optimization]
batch_size = 8
gradient_accumulation = 2
epochs = 100
lr = 2e-4
weight_decay = 0.01
gradient_clip = 1.0

[evaluation]
batch_size = 16
maximum_batches = 32
