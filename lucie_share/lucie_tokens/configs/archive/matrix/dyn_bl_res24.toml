# AUTO-GENERATED: tranche b / res24 / arch l
# hourly frames, 1-hour lead (254k pairs/epoch)
config_version = 1

[data]
cadence_hours = 1
pair_lead_hours = 1

[paths]
dataset_root = "${LUCIE_WORK}/source_packed"
tokenizer_run = "${LUCIE_WORK}/runs/tokenizer_res24x48_seed0"
tokenizer_checkpoint = "${LUCIE_WORK}/runs/tokenizer_res24x48_seed0/best.pt"
token_root = "${LUCIE_WORK}/tokens/res24x48_seed0_1h"
dynamics_run = "${LUCIE_WORK}/runs/dyn_bl_res24"
dynamics_checkpoint = "${LUCIE_WORK}/runs/dyn_bl_res24/best.pt"

[runtime]
device = "cuda"
precision = "auto"
seed = "${LUCIE_SEED}"
resume = true
performance_mode = true
compile = true
compile_mode = "default"
num_workers = 4
prefetch_factor = 2
shuffle_block = 256
validation_batches = 16

[tokenizer]
width = 256
depth = 4
heads = 8
code_dim = 256
codebook_size = 4096
scales = [[1, 2], [2, 4], [3, 6], [6, 12], [12, 24], [24, 48]]
activation_checkpointing = false
decoder_activation_checkpointing = true
decode_scale_batch_size = 6
scale_loss_weights = [0.0476, 0.0952, 0.1429, 0.1905, 0.2381, 0.2857]
commitment_weight = 0.25

[optimization]
batch_size = 2
gradient_accumulation = 4
epochs = 100
lr = 2e-4
weight_decay = 1e-4
gradient_clip = 1.0

[tokenization]
batch_size = 32

[dynamics]
conditioning = true
conditioning_co2 = false
dropout = 0.1
width = 768
depth = 16
heads = 8
activation_checkpointing = false

[dynamics_optimization]
batch_size = 8
gradient_accumulation = 1
epochs = 5
lr = 2e-4
weight_decay = 0.05
gradient_clip = 1.0
input_noise_std = 0.1
noise_refresh_k = 4
noise_prepass_workers = 12
scale_loss_weighting = "inv_log"

[evaluation]
batch_size = 8
maximum_batches = 32
