# Public LUCIE ERA5 T30 dataset (Zenodo 15164648) tokenizer + dynamics.
#
# Source is the in-VRAM era5_npz path: the five prognostic channels of
# era5_T30_regridded.npz (~760 MB bf16) live entirely on the GPU, so none of
# the HDF5 / packed-shard / worker machinery of the Bridges source applies.
# Same proven 5-scale pyramid as the seed0 tokenizer (388 tokens/frame).
config_version = 1

[data]
source_kind = "era5_npz"
npz_path = "${LUCIE_WORK}/datasets/lucie_zenodo_15164648/era5_T30_regridded.npz"
channels = ["temperature", "humidity", "u_wind", "v_wind", "surface_pressure"]
cadence_hours = 6
dtype = "bf16"

[data.split_index]
# regridded.npz has 16538 6-hourly frames; mirror the paper's ntrain=16000.
train = [0, 16000]
val = [16000, 16200]
test = [16200, 16538]

[paths]
dataset_root = "${LUCIE_WORK}/datasets/lucie_zenodo_15164648"
tokenizer_run = "${LUCIE_WORK}/runs/tokenizer_era5t30_${LUCIE_RUN}"
tokenizer_checkpoint = "${LUCIE_WORK}/runs/tokenizer_era5t30_${LUCIE_RUN}/best.pt"
token_root = "${LUCIE_WORK}/tokens/era5t30_${LUCIE_RUN}"
dynamics_run = "${LUCIE_WORK}/runs/dynamics_era5t30_${LUCIE_RUN}"
dynamics_checkpoint = "${LUCIE_WORK}/runs/dynamics_era5t30_${LUCIE_RUN}/best.pt"

[runtime]
device = "cuda"
precision = "auto"
seed = "${LUCIE_SEED}"
resume = true
performance_mode = true
compile = false
validation_batches = 16

[tokenizer]
width = 256
depth = 4
heads = 8
code_dim = 256
codebook_size = 4096
scales = [[1, 2], [2, 4], [3, 6], [6, 12], [12, 24]]
activation_checkpointing = false
decoder_activation_checkpointing = false
decode_scale_batch_size = 5
scale_loss_weights = [0.05, 0.10, 0.15, 0.25, 0.45]
commitment_weight = 0.25
ema_decay = 0.99

[optimization]
# in-VRAM frames, effective batch 16 (batch 16 x accum 1) to match the codebook
# EMA update count the seed0 tokenizer used.
batch_size = 16
gradient_accumulation = 1
epochs = 100
lr = 2e-4
weight_decay = 1e-4
gradient_clip = 1.0

[tokenization]
batch_size = 64

[dynamics]
width = 384
depth = 8
heads = 8
activation_checkpointing = false

[dynamics_optimization]
batch_size = 16
gradient_accumulation = 1
# dynamics overfits (useful rollout optimum ~epoch 10-25 per lucie-findings);
# only latest.pt/best.pt are saved, so land latest.pt in that window.
epochs = 25
lr = 2e-4
weight_decay = 0.01
gradient_clip = 1.0

[evaluation]
batch_size = 8
maximum_batches = 32
