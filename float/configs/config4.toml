config_version = 2

[data]
data_path = "/TACS-float-type/py2d_output/output.h5"
field = "omega"
train_start = 500
train_stop = 8500
val_start = 8500
val_stop = 9000

[run]
output_dir = "runs/fp32_4"
seed = 0
resume = false

[model]
image_size = 256
patch_size = 8
width = 256
n_heads = 8
mlp_dim = 1024
cleanup_hidden_channels = 32
precision = "fp32"

[stage.1]
depth = 12

[optimization]
batch_size = 32
epochs = 100
lr = 1e-4
weight_decay = 1e-4
grad_clip_norm = 1.0

[loader]
num_workers = 4
prefetch_factor = 4
persistent_workers = true
pin_memory = true

[noise]
noise_scale = 0.5
initial_noise_mse = 0.5
mask_seed = 0

