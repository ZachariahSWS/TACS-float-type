config_version = 4

[data]
data_path = "py2d_output/output.h5"
field = "omega"
train_start = 500
train_stop = 8500
val_start = 8500
val_stop = 9000

[run]
output_dir = "runs/v4_1"
seed = 0
resume = false

[model]
image_size = 256
patch_size = 8
width = 128
n_heads = 8
mlp_dim = 512
cleanup_hidden_channels = 32
precision = "fp32"

[stage.1]
depth = 12

[optimization]
batch_size = 2
epochs = 100
lr = 1e-4
weight_decay = 1e-4

[loader]
num_workers = 4
prefetch_factor = 4
persistent_workers = true
pin_memory = true

[noise]
noise_scale = 0.5
initial_noise_mse = 0.5
mask_seed = 0
